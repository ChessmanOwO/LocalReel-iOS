name: LocalReel
options:
  bundleIdPrefix: com.example.localreel
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Public.xcconfig
  Release: Config/Public.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(LOCALREEL_DEVELOPMENT_TEAM)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
packages:
  YouTubeKit:
    path: Vendor/YouTubeKit
targets:
  LocalReel:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(LOCALREEL_BUNDLE_ID_PREFIX)
        INFOPLIST_KEY_CFBundleDisplayName: LocalReel
    dependencies:
      - target: LocalReelShare
        embed: true
      - package: YouTubeKit
  LocalReelShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(LOCALREEL_BUNDLE_ID_PREFIX).share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LocalReelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(LOCALREEL_BUNDLE_ID_PREFIX).tests
    dependencies:
      - target: LocalReel
schemes:
  LocalReel:
    build:
      targets:
        LocalReel: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - LocalReelTests
